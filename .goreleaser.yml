version: 2

project_name: soba

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go mod tidy

builds:
  - id: macos-soba
    binary: soba
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.sha={{ .ShortCommit }} -X main.buildDate={{ .Date }} -X main.tag={{ .Tag }}"

  - id: soba
    binary: soba
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.sha={{ .ShortCommit }} -X main.buildDate={{ .Date }} -X main.tag={{ .Tag }}"

archives:
  - id: regular
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

release:
  github:
    owner: edwardzhu
    name: soba
  prerelease: auto
  name_template: '{{ .Tag }}'
  # Lets a manual re-run of the Release workflow overwrite the assets of a
  # release that already exists instead of failing on the upload.
  replace_existing_artifacts: true

announce:
  skip: true

snapshot:
  version_template: "{{ .Tag }}-devel"

changelog:
  sort: asc
  filters:
    # Anchored to conventional-commit prefixes. These were previously bare
    # substrings matched anywhere in the message, so "test" also matched
    # "testify", "tests" and "test-file", silently dropping real entries from
    # every release: 1.5.0 lost the testify bump, the CI test-workflow PR and
    # a Sonar fix.
    exclude:
      - '^test(\([^)]*\))?:'
      - '^docs?(\([^)]*\))?:'
      - '^ignore(\([^)]*\))?:'

checksum:
  name_template: 'checksums.txt'